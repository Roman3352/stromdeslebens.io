<head>

    <title>Мой лендинг</title>
    <style>
        /* Сброс стилей */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Arial', sans-serif; line-height: 1.6; color: #333; }

        /* Шапка сайта */
        header {
            background: linear-gradient(90deg, #0077cc, #005fa3);
            padding: 20px 10%;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        header h1 { font-size: 28px; }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            transition: color 0.3s;
        }
        nav a:hover { color: #ffd700; }

        /* Hero секция */
        .hero {
            background: url('https://picsum.photos/1920/800') center/cover no-repeat;
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 0 20px;
        }
        .hero h2 { font-size: 48px; margin-bottom: 20px; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }
        .hero p { font-size: 20px; margin-bottom: 30px; text-shadow: 1px 1px 4px rgba(0,0,0,0.5); }
        .btn-main {
            background: #ffd700;
            color: #005fa3;
            padding: 15px 40px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.3s;
        }
        .btn-main:hover { transform: scale(1.05); }

        /* Секции сайта */
        section {
            padding: 80px 10%;
        }
        section h2 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 36px;
        }
        section p { text-align: center; max-width: 700px; margin: 0 auto; font-size: 18px; }

        /* Услуги */
        .services {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
        }
        .services .item {
            background: #f0f0f0;
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .services .item:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .services .item h3 { margin-bottom: 15px; color: #0077cc; }
        .services .item p { color: #555; }

        /* Контакты */
        .contact-form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .contact-form input, .contact-form textarea {
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        .contact-form button {
            padding: 15px;
            border-radius: 8px;
            border: none;
            background: #0077cc;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .contact-form button:hover { background: #005fa3; }

        /* Футер */
        footer {
            background: #121212;
            color: white;
            text-align: center;
            padding: 30px 10%;
        }

        /* Адаптив */
        @media (max-width: 768px) {
            .hero h2 { font-size: 36px; }
            .hero p { font-size: 18px; }
            .services { flex-direction: column; align-items: center; }
            header { flex-direction: column; align-items: flex-start; gap: 10px; }
        }
    </style>
</head>
